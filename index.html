<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Doom</title>

  <!-- Ruffle CDN -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #ruffle-holder {
      width: 100%;
      height: 100%;
    }

    ruffle-player {
      width: 100%;
      height: 100%;
      display: block;
    }

    #ui {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
    }

    button {
      padding: 8px 12px;
      margin-left: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="game-container">
    <div id="ruffle-holder"></div>
  </div>

  <div id="ui">
    <button onclick="toggleFullscreen()">Fullscreen</button>
    <button onclick="clearSave()">Reset Save</button>
  </div>

  <script>
    // ---------------------------
    // RUFFLE SETUP
    // ---------------------------
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      backgroundColor: "#000000",
      letterbox: "on",
      scale: "showAll"
    };

    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    document.getElementById("ruffle-holder").appendChild(player);

    // Load your SWF here
    player.load("doom.swf");

    // ---------------------------
    // RESPONSIVE SCALING
    // ---------------------------
    function resizeGame() {
      const holder = document.getElementById("ruffle-holder");
      holder.style.width = window.innerWidth + "px";
      holder.style.height = window.innerHeight + "px";
    }

    window.addEventListener("resize", resizeGame);
    resizeGame();

    // ---------------------------
    // KEYBOARD CONTROLS
    // ---------------------------
    // The SWF's original controls use the arrow keys.
    // Translate WASD into those same keys so the SWF sees
    // exactly the controls it already understands.
    const wasdMap = {
      "KeyW": { key: "ArrowUp",    code: "ArrowUp",    keyCode: 38 },
      "KeyA": { key: "ArrowLeft",  code: "ArrowLeft",  keyCode: 37 },
      "KeyS": { key: "ArrowDown",  code: "ArrowDown",  keyCode: 40 },
      "KeyD": { key: "ArrowRight", code: "ArrowRight", keyCode: 39 }
    };

    // Keep track of keys so holding W/A/S/D behaves like
    // holding the corresponding arrow key.
    const heldKeys = new Set();

    function sendKey(type, info, originalEvent) {
      const event = new KeyboardEvent(type, {
        key: info.key,
        code: info.code,
        location: 0,
        ctrlKey: originalEvent ? originalEvent.ctrlKey : false,
        shiftKey: originalEvent ? originalEvent.shiftKey : false,
        altKey: originalEvent ? originalEvent.altKey : false,
        metaKey: originalEvent ? originalEvent.metaKey : false,
        repeat: originalEvent ? originalEvent.repeat : false,
        bubbles: true,
        cancelable: true
      });

      // Some older Flash/Ruffle code checks keyCode/which.
      try {
        Object.defineProperty(event, "keyCode", { get: () => info.keyCode });
        Object.defineProperty(event, "which",    { get: () => info.keyCode });
      } catch (_) {}

      // Ruffle normally listens at the document/window level.
      window.dispatchEvent(event);
      document.dispatchEvent(event);
      player.dispatchEvent(event);
    }

    document.addEventListener("keydown", function (e) {
      const info = wasdMap[e.code];
      if (!info) return;

      // Prevent the browser from scrolling when using WASD.
      e.preventDefault();

      if (heldKeys.has(e.code)) return;
      heldKeys.add(e.code);

      sendKey("keydown", info, e);
    }, true);

    document.addEventListener("keyup", function (e) {
      const info = wasdMap[e.code];
      if (!info) return;

      e.preventDefault();
      heldKeys.delete(e.code);

      sendKey("keyup", info, e);
    }, true);

    // Space is also useful as a fire/confirm key.
    // It is translated to Enter because this Doom SWF already
    // recognizes Enter.
    const spaceInfo = {
      key: "Enter",
      code: "Enter",
      keyCode: 13
    };

    document.addEventListener("keydown", function (e) {
      if (e.code !== "Space") return;

      e.preventDefault();
      if (heldKeys.has("Space")) return;
      heldKeys.add("Space");

      sendKey("keydown", spaceInfo, e);
    }, true);

    document.addEventListener("keyup", function (e) {
      if (e.code !== "Space") return;

      e.preventDefault();
      heldKeys.delete("Space");

      sendKey("keyup", spaceInfo, e);
    }, true);

    // ---------------------------
    // MOUSE CONTROLS
    // ---------------------------
    // The SWF contains mouse-input support. Clicking the game
    // focuses it so mouse/keyboard input goes to Ruffle.
    // Left click also acts as Enter (useful for firing/confirming).
    // Right click acts as Escape.
    const gameContainer = document.getElementById("game-container");

    gameContainer.addEventListener("mousedown", function (e) {
      e.preventDefault();

      try {
        player.focus();
      } catch (_) {}

      if (e.button === 0) {
        sendKey("keydown", spaceInfo, e);
      } else if (e.button === 2) {
        sendKey("keydown", {
          key: "Escape",
          code: "Escape",
          keyCode: 27
        }, e);
      }
    });

    gameContainer.addEventListener("mouseup", function (e) {
      e.preventDefault();

      if (e.button === 0) {
        sendKey("keyup", spaceInfo, e);
      } else if (e.button === 2) {
        sendKey("keyup", {
          key: "Escape",
          code: "Escape",
          keyCode: 27
        }, e);
      }
    });

    // Don't open the browser context menu when right-clicking the game.
    gameContainer.addEventListener("contextmenu", function (e) {
      e.preventDefault();
    });

    // ---------------------------
    // FULLSCREEN
    // ---------------------------
    function toggleFullscreen() {
      const elem = document.documentElement;

      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // ---------------------------
    // SAVE DATA HANDLING
    // ---------------------------
    const SAVE_KEY = "ruffle_game_save";

    function saveData(data) {
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    }

    function loadData() {
      const raw = localStorage.getItem(SAVE_KEY);
      return raw ? JSON.parse(raw) : null;
    }

    function clearSave() {
      localStorage.removeItem(SAVE_KEY);
      alert("Save cleared!");
    }

    window.saveFromGame = function(data) {
      saveData(data);
    };

    window.loadToGame = function() {
      return loadData();
    };

    // ---------------------------
    // OPTIONAL AUTO-BACKUP SYSTEM
    // ---------------------------
    setInterval(() => {
      const backup = {};

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key) backup[key] = localStorage.getItem(key);
      }

      localStorage.setItem("ruffle_backup", JSON.stringify(backup));
    }, 5000);
  </script>
</body>
</html>
